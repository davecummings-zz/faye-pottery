<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Icon Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f6f6f6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #3A3A3A;
            text-align: center;
            margin-bottom: 40px;
        }
        .icons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }
        .icon-box {
            background: white;
            padding: 30px;
            border: 2px solid #b6bfb2;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
        }
        .icon-box:hover {
            border-color: #3A3A3A;
            box-shadow: 0 4px 12px rgba(58, 58, 58, 0.1);
        }
        .icon-box svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            color: #3A3A3A;
        }
        .icon-box h3 {
            color: #3A3A3A;
            margin: 0 0 10px 0;
        }
        .icon-box p {
            color: #3A3A3A;
            opacity: 0.7;
            font-size: 14px;
            margin: 0;
        }
        .selected {
            border-color: #3A3A3A;
            background: #f9f9f9;
            border-width: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Cart Icon Options</h1>
        <p style="text-align: center; color: #3A3A3A; margin-bottom: 30px;">Click an icon to select it. Then tell me which number you prefer!</p>
        
        <div class="icons">
            <!-- Option 1: Cart with items (filled) -->
            <div class="icon-box" onclick="selectIcon(1)">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7 4V3a1 1 0 011-1h6a1 1 0 011 1v1h4a1 1 0 010 2h-.757l.757 10.289A2 2 0 0116.201 18H5.799a2 2 0 01-1.799-2.711L4.757 6H4a1 1 0 010-2h3zm2 2h6V4H9v2z"/>
                </svg>
                <h3>Option 1</h3>
                <p>Cart with items (filled/detailed)</p>
            </div>

            <!-- Option 2: Shopping bag outline -->
            <div class="icon-box" onclick="selectIcon(2)">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
                <h3>Option 2</h3>
                <p>Shopping bag (outline)</p>
            </div>

            <!-- Option 3: Filled shopping bag -->
            <div class="icon-box" onclick="selectIcon(3)">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-1-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
                <h3>Option 3</h3>
                <p>Filled shopping bag</p>
            </div>

            <!-- Option 4: Simple cart outline (cleaner) -->
            <div class="icon-box" onclick="selectIcon(4)">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 8m10 0l2-8m-12 8h12m0 0a1 1 0 100-2 1 1 0 000 2z"/>
                </svg>
                <h3>Option 4</h3>
                <p>Simple cart outline (cleaner)</p>
            </div>
        </div>

        <p style="text-align: center; color: #3A3A3A; font-size: 14px; margin-top: 40px;">
            <strong>Selected:</strong> <span id="selected">None yet</span>
        </p>
    </div>

    <script>
        function selectIcon(number) {
            // Remove selected state from all
            document.querySelectorAll('.icon-box').forEach(box => {
                box.classList.remove('selected');
            });
            
            // Add selected state to clicked box
            event.currentTarget.classList.add('selected');
            
            // Update text
            document.getElementById('selected').textContent = `Option ${number}`;
        }
    </script>
</body>
</html>
